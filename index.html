function legalPage(title,items){return `<main><section class="page-head"><div class="container"><h1>${title}</h1></div></section><section class="container"><article class="legal-card"><p class="updated">Last Updated: December 2024</p>${items.map(([head,content])=>`<section class="legal-section"><h2>${head}</h2>${Array.isArray(content)?`${content[0].startsWith('We collect')||content[0].startsWith('We use')||content[0].startsWith('We may share')||content[0].startsWith('Depending')||content[0].startsWith('When using')||content[0].startsWith('You agree')?`<p>${content[0]}</p>`:''}<ul>${content.slice(1).map(x=>`<li>${x}</li>`).join('')}</ul>${content[0].startsWith('If you ')||content[0].startsWith('To exercise')?`<p>${content[0]}</p>`:''}`:`<p>${content}</p>`}</section>`).join('')}</article></section></main>`}
function render(){const route=location.hash.replace(/^#/, '')||'/';let page;if(route==='/faq')page=faqPage();else if(route==='/privacy')page=legalPage('Privacy Policy',privacy);else if(route==='/terms')page=legalPage('Terms and Conditions',terms);else page=homepage();document.getElementById('app').innerHTML=header()+page+footer();document.querySelectorAll('.navlinks [data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route));document.querySelectorAll('.faq-question').forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('.faq-item');item.classList.toggle('open');btn.setAttribute('aria-expanded',item.classList.contains('open'));}));const menu=document.querySelector('.mobile-menu'),links=document.querySelector('.navlinks');menu.addEventListener('click',()=>{const open=links.classList.toggle('show');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'×':'☰'});document.querySelectorAll('.navlinks a').forEach(a=>a.addEventListener('click',()=>{links.classList.remove('show');menu.setAttribute('aria-expanded','false');menu.textContent='☰';}));window.scrollTo(0,0)}window.addEventListener('hashchange',render);
if(location.hash==='#/faq') location.replace('/faq/');
else if(location.hash==='#/privacy') location.replace('/privacy-policy/');
else if(location.hash==='#/terms') location.replace('/terms/');
render();
</script>

<script id="utility-payment-popup-script">
(function(){
  const backdrop=document.getElementById('utility-payment-popup-backdrop');
  if(!backdrop) return;
  const popup=backdrop.querySelector('#utility-payment-popup');
  const closeBtn=backdrop.querySelector('.popup-close');
  const stayBtn=backdrop.querySelector('.popup-stay');
  let previousOverflow='';
  function closePopup(){
    backdrop.classList.remove('is-visible');
    backdrop.setAttribute('aria-hidden','true');
    document.body.style.overflow=previousOverflow;
  }
  function openPopup(){
    previousOverflow=document.body.style.overflow;
    backdrop.classList.add('is-visible');
    backdrop.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  closeBtn.addEventListener('click',closePopup);
  stayBtn.addEventListener('click',closePopup);
  backdrop.addEventListener('click',function(e){if(e.target===backdrop) closePopup()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&backdrop.classList.contains('is-visible')) closePopup()});
  window.addEventListener('load',function(){setTimeout(openPopup,700)});
})();
</script>
